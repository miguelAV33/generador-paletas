<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Paletas — Miguel Ángel Alonso Valhondo</title>
<meta name="description" content="Genera paletas de color infinitas, explora una colección curada de paletas reales, bloquea tus favoritas y guárdalas en el navegador. Herramienta en JavaScript puro, sin frameworks.">

<style>
  :root {
    --bg: #12151d;
    --surface: #1a212d;
    --surface-2: #202938;
    --line: #2b3546;
    --text: #edf1f7;
    --text-muted: #8a93a6;
    --accent: #6f9bc9;
    --accent-warm: #c9a468;
    font-family: 'Space Grotesk', 'IBM Plex Sans', 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  a { color: inherit; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .topbar__brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
  }

  .topbar__brand span.mark {
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
  }

  .back-link {
    font-size: 0.82rem;
    color: var(--text-muted);
    text-decoration: none;
    border: 1px solid var(--line);
    padding: 7px 14px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .back-link:hover { border-color: var(--accent); color: var(--text); }

  .tabs {
    display: flex;
    gap: 6px;
    padding: 12px 24px 0;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }

  .tab-btn {
    font-family: inherit;
    font-size: 0.85rem;
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 10px 16px;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }

  .tab-btn.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  .tab-btn:hover { color: var(--text); }

  .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .view.active { display: flex; }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .controls label {
    font-size: 0.78rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  select, button {
    font-family: inherit;
    font-size: 0.85rem;
  }

  select {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
  }

  .btn {
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }

  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: scale(0.97); }

  .btn--primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #0d1119;
    font-weight: 600;
  }

  .btn--primary:hover { background: #80a9d4; }

  .btn--ghost { background: transparent; }

  .hint {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-left: auto;
  }

  kbd {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
  }

  .palette {
    flex: 1;
    display: flex;
    min-height: 320px;
  }

  .swatch {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 36px;
    transition: flex .25s ease;
    cursor: pointer;
  }

  .swatch__top {
    position: absolute;
    top: 18px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
  }

  .swatch__lock {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    cursor: pointer;
    backdrop-filter: blur(2px);
  }

  .swatch.locked .swatch__lock { background: rgba(0,0,0,0.4); border-color: currentColor; }

  .swatch__hex {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    background: rgba(0,0,0,0.12);
    padding: 6px 14px;
    border-radius: 999px;
  }

  .swatch__name {
    font-size: 0.7rem;
    opacity: 0.75;
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .swatch__copied {
    position: absolute;
    bottom: 36px;
    font-size: 0.75rem;
    background: #12151d;
    color: #edf1f7;
    padding: 4px 10px;
    border-radius: 6px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
  }

  .swatch.copied .swatch__copied {
    opacity: 1;
    transform: translateY(-34px);
  }

  .saved-panel {
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 16px 24px 24px;
  }

  .saved-panel__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .saved-panel__head h2 {
    font-size: 0.9rem;
    margin: 0;
    color: var(--text-muted);
    font-weight: 500;
  }

  .saved-list {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .saved-item {
    display: flex;
    flex-direction: column;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--line);
    cursor: pointer;
    width: 120px;
  }

  .saved-item__swatches { display: flex; height: 40px; }
  .saved-item__color { flex: 1; height: 100%; }

  .saved-item__footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px;
    background: var(--surface-2);
  }

  .saved-item__name {
    font-size: 0.68rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .saved-item__remove {
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    color: var(--text-muted);
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
    flex-shrink: 0;
  }

  .saved-item__remove:hover { color: #e08585; }

  .saved-empty {
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  /* --- Explorar --- */

  .explore-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .filter-chip {
    font-family: inherit;
    font-size: 0.78rem;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
  }

  .filter-chip.active {
    border-color: var(--accent);
    color: var(--text);
    background: rgba(111, 155, 201, 0.12);
  }

  .explore-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px 40px;
  }

  .explore-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color .15s ease, transform .15s ease;

  .card:hover { border-color: var(--accent); transform: translateY(-2px); }

  .card__swatches {
    display: flex;
    height: 90px;
  }

  .card__color {
    flex: 1;
    position: relative;
  }

  .card__color:hover .card__copytag { opacity: 1; }

  .card__copytag {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.62rem;
    background: rgba(0,0,0,0.35);
    opacity: 0;
    transition: opacity .15s ease;
  }

  .card__footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
  }

  .card__name {
    font-size: 0.82rem;
    font-weight: 500;
  }

  .card__save {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
  }

  .card__save.is-saved { color: var(--accent-warm); }

  .sentinel {
    height: 1px;
  }

  .loading-row {
    text-align: center;
    padding: 20px;
    color: var(--text-muted);
    font-size: 0.8rem;
  }

  @media (max-width: 760px) {
    .palette { flex-direction: column; }
    .hint { display: none; }
  }
</style>
</head>

  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs((h / 60) % 2 - 1));
    var m = l - c / 2;
    var r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }
    var toHex = function (v) {
      var hex = Math.round((v + m) * 255).toString(16);
      return hex.length === 1 ? '0' + hex : hex;
    };
    return '#' + toHex(r) + toHex(g) + toHex(b);
  }

  }

  function textColorFor(hex) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    var yiq = (r * 299 + g * 587 + b * 114) / 1000;
    return yiq >= 150 ? '#12151d' : '#f5f7fb';
  }

  function randomHue() { return Math.floor(Math.random() * 360); }

  function buildHarmony(mode, count) {
    var baseHue = randomHue();
    var colors = [];
    var i;

    if (mode === 'random') {
      for (i = 0; i < count; i++) {
        colors.push({ h: randomHue(), s: 55 + Math.random() * 35, l: 35 + Math.random() * 35 });
      }
    } else if (mode === 'analogous') {
      for (i = 0; i < count; i++) {
        var hue = (baseHue + (i - Math.floor(count / 2)) * 22 + 360) % 360;
        colors.push({ h: hue, s: 55 + Math.random() * 25, l: 32 + i * (40 / count) });
      }
    } else if (mode === 'complementary') {
      for (i = 0; i < count; i++) {
        var hue2 = i % 2 === 0 ? baseHue : (baseHue + 180) % 360;
        colors.push({ h: hue2, s: 50 + Math.random() * 30, l: 28 + (i / count) * 45 });
      }
    } else if (mode === 'triadic') {
      var triadHues = [baseHue, (baseHue + 120) % 360, (baseHue + 240) % 360];
      for (i = 0; i < count; i++) {
        colors.push({ h: triadHues[i % 3], s: 50 + Math.random() * 30, l: 30 + (i / count) * 45 });
      }
    } else if (mode === 'monochromatic') {
      for (i = 0; i < count; i++) {
        colors.push({ h: baseHue, s: 45 + Math.random() * 20, l: 18 + (i * (64 / Math.max(count - 1, 1))) });
      }
    } else if (mode === 'pastel') {
      for (i = 0; i < count; i++) {
        colors.push({ h: (baseHue + i * (360 / count)) % 360, s: 40 + Math.random() * 20, l: 72 + Math.random() * 12 });
      }
    }
    return colors;
  }

  function generate() {
    var mode = harmonySelect.value;
    var count = parseInt(countSelect.value, 10);
    var fresh = buildHarmony(mode, count);

    if (state.colors.length !== count) {
      state.colors = fresh.map(function (c) { return { h: c.h, s: c.s, l: c.l, locked: false }; });
    } else {
      state.colors = state.colors.map(function (existing, idx) {
        if (existing.locked) return existing;
        return { h: fresh[idx].h, s: fresh[idx].s, l: fresh[idx].l, locked: false };
      });
    }
    render();
  }

  function render() {
    paletteEl.innerHTML = '';
    state.colors.forEach(function (color, idx) {
      var hex = hslToHex(color.h, color.s, color.l);
      var isLight = relativeLuminance(color.h, color.s, color.l) > 0.6;
      var textColor = isLight ? '#12151d' : '#f5f7fb';

      var swatch = document.createElement('div');
      swatch.className = 'swatch' + (color.locked ? ' locked' : '');
      swatch.style.background = hex;
      swatch.style.color = textColor;
      swatch.dataset.index = idx;

      var top = document.createElement('div');
      top.className = 'swatch__top';
      var lock = document.createElement('button');
      lock.className = 'swatch__lock';
      lock.type = 'button';
      lock.setAttribute('aria-label', color.locked ? 'Desbloquear color' : 'Bloquear color');
      lock.textContent = color.locked ? '🔒' : '🔓';
      lock.style.color = textColor;
      lock.addEventListener('click', function (e) {
        e.stopPropagation();
        color.locked = !color.locked;
        render();
      });
      top.appendChild(lock);

      var hexLabel = document.createElement('div');
      hexLabel.className = 'swatch__hex';
      hexLabel.textContent = hex.toUpperCase();

      var nameLabel = document.createElement('div');
      nameLabel.className = 'swatch__name';
      nameLabel.textContent = 'Clic para copiar';

      var copiedTag = document.createElement('div');
      copiedTag.className = 'swatch__copied';
      copiedTag.textContent = 'Copiado';

      swatch.appendChild(top);
      swatch.appendChild(hexLabel);
      swatch.appendChild(nameLabel);
      swatch.appendChild(copiedTag);

      swatch.addEventListener('click', function () {
        copyToClipboard(hex.toUpperCase());
        swatch.classList.add('copied');
        setTimeout(function () { swatch.classList.remove('copied'); }, 900);
      });

      paletteEl.appendChild(swatch);
    });
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* no-op */ }
    document.body.removeChild(ta);
  }

  function currentHexList() {
    return state.colors.map(function (c) { return hslToHex(c.h, c.s, c.l).toUpperCase(); });
  }

  // ---------------------------------------------------------------------
  // Guardadas (compartidas entre Generar y Explorar)
  // ---------------------------------------------------------------------

  function loadSaved() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      // normaliza el formato antiguo (array de hex) al nuevo {name, colors}
      return parsed.map(function (p) {
        if (Array.isArray(p)) return { name: 'Paleta guardada', colors: p };
        return p;
      });
    } catch (e) {
      return [];
    }
  }

  function persistSaved(list) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    } catch (e) { /* storage unavailable, ignore */ }
  }

  function isSaved(colors) {
    var key = colors.join(',').toLowerCase();
    return loadSaved().some(function (p) { return p.colors.join(',').toLowerCase() === key; });
  }

  function toggleSavedPalette(name, colors) {
    var list = loadSaved();
    var key = colors.join(',').toLowerCase();
    var idx = list.findIndex(function (p) { return p.colors.join(',').toLowerCase() === key; });
    if (idx >= 0) {
      list.splice(idx, 1);
    } else {
      list.unshift({ name: name, colors: colors });
      if (list.length > 24) list = list.slice(0, 24);
    }
    persistSaved(list);
    renderSaved();
    renderExploreSaveStates();
  }

  function renderSaved() {
    var list = loadSaved();
    savedListEl.innerHTML = '';
    if (list.length === 0) {
      var empty = document.createElement('p');
      empty.className = 'saved-empty';
      empty.textContent = 'Todavía no has guardado ninguna paleta.';
      savedListEl.appendChild(empty);
      return;
    }
    list.forEach(function (palette, idx) {
      var item = document.createElement('div');
      item.className = 'saved-item';
      item.title = palette.colors.join(', ');

      var swatchesRow = document.createElement('div');
      swatchesRow.className = 'saved-item__swatches';
      palette.colors.forEach(function (hex) {
        var block = document.createElement('div');
        block.className = 'saved-item__color';
        block.style.background = hex;
        swatchesRow.appendChild(block);
      });
      item.appendChild(swatchesRow);

      var footer = document.createElement('div');
      footer.className = 'saved-item__footer';
      var nameSpan = document.createElement('span');
      nameSpan.className = 'saved-item__name';
      nameSpan.textContent = palette.name || 'Paleta';
      footer.appendChild(nameSpan);

      var removeBtn = document.createElement('button');
      removeBtn.className = 'saved-item__remove';
      removeBtn.type = 'button';
      removeBtn.textContent = '×';
      removeBtn.setAttribute('aria-label', 'Eliminar paleta guardada');
      removeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        var updated = loadSaved();
        updated.splice(idx, 1);
        persistSaved(updated);
        renderSaved();
        renderExploreSaveStates();
      });
      footer.appendChild(removeBtn);
      item.appendChild(footer);

      item.addEventListener('click', function () {
        state.colors = palette.colors.map(function (hex) { return hexToHsl(hex); });
        countSelect.value = String(Math.min(Math.max(palette.colors.length, 3), 7));
        activateTab('generate');
        render();
      });

      savedListEl.appendChild(item);
    });
  }

  function hexToHsl(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255;
    var g = parseInt(hex.slice(3, 5), 16) / 255;
    var b = parseInt(hex.slice(5, 7), 16) / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b);
    var h = 0, s = 0, l = (max + min) / 2;
    if (max !== min) {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return { h: h, s: s * 100, l: l * 100, locked: false };
  }

  // ---------------------------------------------------------------------
  // Explorar: colección curada + generación infinita por etiqueta
  // ---------------------------------------------------------------------

  var ADJECTIVES = ['Suave', 'Profundo', 'Templado', 'Brumoso', 'Dorado', 'Sereno', 'Vivo', 'Pálido', 'Intenso', 'Nocturno', 'Luminoso', 'Tranquilo'];
  var NOUNS = ['Horizonte', 'Bruma', 'Eco', 'Deriva', 'Susurro', 'Reflejo', 'Vuelo', 'Oasis', 'Latido', 'Sendero', 'Destello', 'Marea'];

  var TAG_RANGES = {
    calidas:  { hue: [-20, 55],  sat: [55, 85], light: [38, 62] },
    frias:    { hue: [180, 260], sat: [45, 80], light: [35, 60] },
    pastel:   { hue: [0, 360],   sat: [35, 55], light: [72, 88] },
    oscuras:  { hue: [0, 360],   sat: [30, 60], light: [14, 30] },
    vivas:    { hue: [0, 360],   sat: [70, 95], light: [45, 60] },
    tierra:   { hue: [20, 45],   sat: [25, 55], light: [30, 60] },
    todas:    { hue: [0, 360],   sat: [40, 80], light: [30, 70] }
  };

  function randomInRange(range) {
    var lo = range[0], hi = range[1];
    return lo + Math.random() * (hi - lo);
  }

  function randomName() {
    var a = ADJECTIVES[Math.floor(Math.random() * ADJECTIVES.length)];
    var n = NOUNS[Math.floor(Math.random() * NOUNS.length)];
    return n + ' ' + a;
  }

  function generateForTag(tag) {
    var range = TAG_RANGES[tag] || TAG_RANGES.todas;
    var baseHue = randomInRange(range.hue);
    if (baseHue < 0) baseHue += 360;
    baseHue = baseHue % 360;
    var colors = [];
    for (var i = 0; i < 5; i++) {
      var h = (baseHue + i * (30 + Math.random() * 25)) % 360;
      var s = randomInRange(range.sat);
      var l = randomInRange(range.light) + (i - 2) * 4;
      l = Math.max(10, Math.min(92, l));
      colors.push(hslToHex(h, s, l).toUpperCase());
    }
    return { name: randomName(), tags: [tag === 'todas' ? 'vivas' : tag], colors: colors };
  }

  var exploreState = {
    tag: 'todas',
    curatedPointer: 0,
    curatedOrder: [],
    loading: false
  };

  function shuffledCurated() {
    var arr = CURATED_PALETTES.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function nextExploreBatch(count) {
    var batch = [];
    var filterTag = exploreState.tag;

    while (batch.length < count) {
      if (exploreState.curatedPointer < exploreState.curatedOrder.length) {
        var candidate = exploreState.curatedOrder[exploreState.curatedPointer];
        exploreState.curatedPointer++;
        if (filterTag === 'todas' || candidate.tags.indexOf(filterTag) !== -1) {
          batch.push(candidate);
        }
      } else {
        // colección curada agotada (o filtrada a cero): generamos el resto,
        // así el scroll no se detiene nunca
        batch.push(generateForTag(filterTag));
      }
    }
    return batch;
  }

  function renderExploreSaveStates() {
    var cards = exploreGrid.querySelectorAll('.card');
    cards.forEach(function (card) {
      var colors = JSON.parse(card.dataset.colors);
      var btn = card.querySelector('.card__save');
      if (btn) btn.classList.toggle('is-saved', isSaved(colors));
    });
  }

  function appendExploreCard(palette) {
    var card = document.createElement('div');
    card.className = 'card';
    card.dataset.colors = JSON.stringify(palette.colors);

    var swatches = document.createElement('div');
    swatches.className = 'card__swatches';
    palette.colors.forEach(function (hex) {
      var block = document.createElement('div');
      block.className = 'card__color';
      block.style.background = hex;
      var tag = document.createElement('div');
      tag.className = 'card__copytag';
      tag.style.color = textColorFor(hex);
      tag.textContent = hex.toUpperCase();
      block.appendChild(tag);
      block.addEventListener('click', function (e) {
        e.stopPropagation();
        copyToClipboard(hex.toUpperCase());
      });
      swatches.appendChild(block);
    });
    card.appendChild(swatches);

    var footer = document.createElement('div');
    footer.className = 'card__footer';
    var name = document.createElement('span');
    name.className = 'card__name';
    name.textContent = palette.name;
    footer.appendChild(name);

    var saveBtn = document.createElement('button');
    saveBtn.className = 'card__save' + (isSaved(palette.colors) ? ' is-saved' : '');
    saveBtn.type = 'button';
    saveBtn.innerHTML = '&#9733;';
    saveBtn.setAttribute('aria-label', 'Guardar paleta');
    saveBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      toggleSavedPalette(palette.name, palette.colors);
    });
    footer.appendChild(saveBtn);
    card.appendChild(footer);

    card.addEventListener('click', function () {
      copyToClipboard(palette.colors.join(', '));
      var original = name.textContent;
      name.textContent = 'Copiada ✓';
      setTimeout(function () { name.textContent = original; }, 900);
    });

    exploreGrid.appendChild(card);
  }

  function loadMoreExplore() {
    if (exploreState.loading) return;
    exploreState.loading = true;
    var batch = nextExploreBatch(12);
    batch.forEach(appendExploreCard);
    exploreState.loading = false;
  }

  function resetExplore(tag) {
    exploreState.tag = tag;
    exploreState.curatedPointer = 0;
    exploreState.curatedOrder = shuffledCurated();
    exploreGrid.innerHTML = '';
    exploreScroll.scrollTop = 0;
    loadMoreExplore();
  }

  exploreScroll.addEventListener('scroll', function () {
    var distanceToBottom = exploreScroll.scrollHeight - exploreScroll.scrollTop - exploreScroll.clientHeight;
    if (distanceToBottom < 500) loadMoreExplore();
  });

  document.getElementById('filterChips').addEventListener('click', function (e) {
    var chip = e.target.closest('.filter-chip');
    if (!chip) return;
    document.querySelectorAll('.filter-chip').forEach(function (c) { c.classList.remove('active'); });
    chip.classList.add('active');
    resetExplore(chip.dataset.tag);
  });

  // ---------------------------------------------------------------------
  // Pestañas
  // ---------------------------------------------------------------------

  function activateTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    document.getElementById('viewGenerate').classList.toggle('active', tab === 'generate');
    document.getElementById('viewExplore').classList.toggle('active', tab === 'explore');
  }

  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { activateTab(btn.dataset.tab); });
  });

  // ---------------------------------------------------------------------
  // Wiring general
  // ---------------------------------------------------------------------

  document.getElementById('generateBtn').addEventListener('click', generate);
  document.getElementById('saveBtn').addEventListener('click', function () {
    toggleSavedPalette('Paleta generada', currentHexList());
  });
  document.getElementById('clearSavedBtn').addEventListener('click', function () {
    persistSaved([]);
    renderSaved();
    renderExploreSaveStates();
  });
  document.getElementById('exportBtn').addEventListener('click', function () {
    var css = ':root {\n' + currentHexList().map(function (hex, i) {
      return '  --color-' + (i + 1) + ': ' + hex + ';';
    }).join('\n') + '\n}';
    copyToClipboard(css);
  });
  harmonySelect.addEventListener('change', generate);
  countSelect.addEventListener('change', function () {
    state.colors = [];
    generate();
  });

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      generate();
    }
  });

  generate();
  renderSaved();
  resetExplore('todas');
})();
</script>
</body>
</html>
