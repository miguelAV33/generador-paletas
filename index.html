<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Paletas — Miguel Ángel Alonso Valhondo</title>
<meta name="description" content="Genera paletas de color infinitas, explora una colección curada de paletas reales, bloquea tus favoritas y guárdalas en el navegador. Herramienta en JavaScript puro, sin frameworks.">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #12151d;
    --surface: #1a212d;
    --surface-2: #202938;
    --line: #2b3546;
    --text: #edf1f7;
    --text-muted: #8a93a6;
    --accent: #6f9bc9;
    --accent-warm: #c9a468;
    font-family: 'Space Grotesk', 'IBM Plex Sans', 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  a { color: inherit; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .topbar__brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
  }

  .topbar__brand span.mark {
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
  }

  .back-link {
    font-size: 0.82rem;
    color: var(--text-muted);
    text-decoration: none;
    border: 1px solid var(--line);
    padding: 7px 14px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .back-link:hover { border-color: var(--accent); color: var(--text); }

  .tabs {
    display: flex;
    gap: 6px;
    padding: 12px 24px 0;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }

  .tab-btn {
    font-family: inherit;
    font-size: 0.85rem;
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 10px 16px;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }

  .tab-btn.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  .tab-btn:hover { color: var(--text); }

  .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .view.active { display: flex; }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .controls label {
    font-size: 0.78rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  select, button {
    font-family: inherit;
    font-size: 0.85rem;
  }

  select {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
  }

  .btn {
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }

  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: scale(0.97); }

  .btn--primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #0d1119;
    font-weight: 600;
  }

  .btn--primary:hover { background: #80a9d4; }

  .btn--ghost { background: transparent; }

  .hint {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-left: auto;
  }

  kbd {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
  }

  .palette {
    flex: 1;
    display: flex;
    min-height: 320px;
  }

  .swatch {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 36px;
    transition: flex .25s ease;
    cursor: pointer;
  }

  .swatch__top {
    position: absolute;
    top: 18px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
  }

  .swatch__lock {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    cursor: pointer;
    backdrop-filter: blur(2px);
  }

  .swatch.locked .swatch__lock { background: rgba(0,0,0,0.4); border-color: currentColor; }

  .swatch__hex {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    background: rgba(0,0,0,0.12);
    padding: 6px 14px;
    border-radius: 999px;
  }

  .swatch__name {
    font-size: 0.7rem;
    opacity: 0.75;
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .swatch__copied {
    position: absolute;
    bottom: 36px;
    font-size: 0.75rem;
    background: #12151d;
    color: #edf1f7;
    padding: 4px 10px;
    border-radius: 6px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
  }

  .swatch.copied .swatch__copied {
    opacity: 1;
    transform: translateY(-34px);
  }

  .saved-panel {
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 16px 24px 24px;
  }

  .saved-panel__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .saved-panel__head h2 {
    font-size: 0.9rem;
    margin: 0;
    color: var(--text-muted);
    font-weight: 500;
  }

  .saved-list {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .saved-item {
    display: flex;
    flex-direction: column;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--line);
    cursor: pointer;
    width: 120px;
  }

  .saved-item__swatches { display: flex; height: 40px; }
  .saved-item__color { flex: 1; height: 100%; }

  .saved-item__footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px;
    background: var(--surface-2);
  }

  .saved-item__name {
    font-size: 0.68rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .saved-item__remove {
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    color: var(--text-muted);
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
    flex-shrink: 0;
  }

  .saved-item__remove:hover { color: #e08585; }

  .saved-empty {
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  /* --- Explorar --- */

  .explore-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .filter-chip {
    font-family: inherit;
    font-size: 0.78rem;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
  }

  .filter-chip.active {
    border-color: var(--accent);
    color: var(--text);
    background: rgba(111, 155, 201, 0.12);
  }

  .explore-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px 40px;
  }

  .explore-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color .15s ease, transform .15s ease;
  }

  .card:hover { border-color: var(--accent); transform: translateY(-2px); }

  .card__swatches {
    display: flex;
    height: 90px;
  }

  .card__color {
    flex: 1;
    position: relative;
  }

  .card__color:hover .card__copytag { opacity: 1; }

  .card__copytag {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.62rem;
    background: rgba(0,0,0,0.35);
    opacity: 0;
    transition: opacity .15s ease;
  }

  .card__footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
  }

  .card__name {
    font-size: 0.82rem;
    font-weight: 500;
  }

  .card__source {
    display: inline-block;
    margin-left: 6px;
    font-size: 0.62rem;
    font-weight: 400;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .card__source--api { color: var(--accent); }

  .card__save {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
  }

  .card__save.is-saved { color: var(--accent-warm); }

  .sentinel {
    height: 1px;
  }

  .loading-row {
    display: none;
    text-align: center;
    padding: 20px;
    color: var(--text-muted);
    font-size: 0.8rem;
  }

  @media (max-width: 760px) {
    .palette { flex-direction: column; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="https://tu-dominio.netlify.app" class="topbar__brand"><span class="mark">{ }</span> Generador de Paletas</a>
  <a href="https://github.com/HookMike/generador-paletas" class="back-link">Ver código en GitHub</a>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="generate">Generar</button>
  <button class="tab-btn" data-tab="explore">Explorar (infinitas)</button>
</div>

<div class="view active" id="viewGenerate">
  <div class="controls">
    <label>Armonía
      <select id="harmonySelect">
        <option value="random">Aleatoria</option>
        <option value="analogous">Análoga</option>
        <option value="complementary">Complementaria</option>
        <option value="triadic">Tríada</option>
        <option value="monochromatic">Monocromática</option>
        <option value="pastel">Pastel</option>
      </select>
    </label>
    <label>Colores
      <select id="countSelect">
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5" selected>5</option>
        <option value="6">6</option>
        <option value="7">7</option>
      </select>
    </label>
    <button class="btn btn--primary" id="generateBtn">Generar (espacio)</button>
    <button class="btn" id="saveBtn">Guardar paleta</button>
    <button class="btn btn--ghost" id="exportBtn">Copiar CSS</button>
    <span class="hint">Pulsa <kbd>espacio</kbd> para regenerar los colores no bloqueados</span>
  </div>

  <div class="palette" id="palette"></div>
</div>

<div class="view" id="viewExplore">
  <div class="explore-controls" id="filterChips">
    <button class="filter-chip active" data-tag="todas">Todas</button>

    <button class="filter-chip" data-tag="pastel">Pastel</button>
    <button class="filter-chip" data-tag="oscuras">Oscuras</button>
    <button class="filter-chip" data-tag="vivas">Vivas</button>
    <button class="filter-chip" data-tag="tierra">Tierra</button>
    <span class="hint">Se cargan más paletas automáticamente al hacer scroll: curadas, en vivo desde internet y generadas — nunca se acaban</span>
  </div>
  <div class="explore-scroll" id="exploreScroll">
    <div class="explore-grid" id="exploreGrid"></div>
    <div class="sentinel" id="scrollSentinel"></div>
    <div class="loading-row">Generando más paletas…</div>
  </div>
</div>

<div class="saved-panel">
  <div class="saved-panel__head">
    <h2>Paletas guardadas</h2>
    <button class="btn btn--ghost" id="clearSavedBtn" style="font-size:0.75rem;padding:5px 12px;">Borrar todas</button>
  </div>
  <div class="saved-list" id="savedList"></div>
</div>

  const paletteEl = document.getElementById('palette');
  const savedListEl = document.getElementById('savedList');

  const state = {

  const hslToHex = (h, s, l) => {
    s /= 100;
    l /= 100;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = l - c / 2;
    let [r, g, b] = [0, 0, 0];
    if (h < 60) [r, g, b] = [c, x, 0];
    else if (h < 120) [r, g, b] = [x, c, 0];
    else if (h < 180) [r, g, b] = [0, c, x];
    else if (h < 240) [r, g, b] = [0, x, c];
    else if (h < 300) [r, g, b] = [x, 0, c];
    else [r, g, b] = [c, 0, x];
    const toHex = (v) => Math.round((v + m) * 255).toString(16).padStart(2, '0');
    return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
  };

  const hexToHsl = (hex) => {
    const r = parseInt(hex.slice(1, 3), 16) / 255;
    const g = parseInt(hex.slice(3, 5), 16) / 255;
    const b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    let h = 0;
    const l = (max + min) / 2;
    let s = 0;
    if (max !== min) {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return { h, s: s * 100, l: l * 100, locked: false };
  };

  const relativeLuminance = (h, s, l) => l / 100;

  const textColorFor = (hex) => {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    const yiq = (r * 299 + g * 587 + b * 114) / 1000;
    return yiq >= 150 ? '#12151d' : '#f5f7fb';
  };

  const randomHue = () => Math.floor(Math.random() * 360);

  const buildHarmony = (mode, count) => {
    const baseHue = randomHue();
    const colors = [];

    if (mode === 'random') {
      for (let i = 0; i < count; i++) {
        colors.push({ h: randomHue(), s: 55 + Math.random() * 35, l: 35 + Math.random() * 35 });
      }
    } else if (mode === 'analogous') {
      for (let i = 0; i < count; i++) {
        const hue = (baseHue + (i - Math.floor(count / 2)) * 22 + 360) % 360;
        colors.push({ h: hue, s: 55 + Math.random() * 25, l: 32 + i * (40 / count) });
      }
    } else if (mode === 'complementary') {
      for (let i = 0; i < count; i++) {
        const hue = i % 2 === 0 ? baseHue : (baseHue + 180) % 360;
        colors.push({ h: hue, s: 50 + Math.random() * 30, l: 28 + (i / count) * 45 });
      }
    } else if (mode === 'triadic') {
      const triadHues = [baseHue, (baseHue + 120) % 360, (baseHue + 240) % 360];
      for (let i = 0; i < count; i++) {
        colors.push({ h: triadHues[i % 3], s: 50 + Math.random() * 30, l: 30 + (i / count) * 45 });
      }
    } else if (mode === 'monochromatic') {
      for (let i = 0; i < count; i++) {
        colors.push({ h: baseHue, s: 45 + Math.random() * 20, l: 18 + i * (64 / Math.max(count - 1, 1)) });
      }
    } else if (mode === 'pastel') {
      for (let i = 0; i < count; i++) {
        colors.push({ h: (baseHue + i * (360 / count)) % 360, s: 40 + Math.random() * 20, l: 72 + Math.random() * 12 });
      }
    }
    return colors;
  };

  const generate = () => {
    const mode = harmonySelect.value;
    const count = parseInt(countSelect.value, 10);
    const fresh = buildHarmony(mode, count);

    state.colors = state.colors.length === count
      ? state.colors.map((existing, idx) => (existing.locked ? existing : { ...fresh[idx], locked: false }))
      : fresh.map((c) => ({ ...c, locked: false }));

    render();
  };

  const render = () => {
    paletteEl.innerHTML = '';
    state.colors.forEach((color) => {
      const hex = hslToHex(color.h, color.s, color.l);
      const isLight = relativeLuminance(color.h, color.s, color.l) > 0.6;
      const textColor = isLight ? '#12151d' : '#f5f7fb';

      const swatch = document.createElement('div');
      swatch.className = `swatch${color.locked ? ' locked' : ''}`;
      swatch.style.background = hex;
      swatch.style.color = textColor;

      const top = document.createElement('div');
      top.className = 'swatch__top';
      const lock = document.createElement('button');
      lock.className = 'swatch__lock';
      lock.type = 'button';
      lock.setAttribute('aria-label', color.locked ? 'Desbloquear color' : 'Bloquear color');
      lock.textContent = color.locked ? '🔒' : '🔓';
      lock.style.color = textColor;
      lock.addEventListener('click', (e) => {
        e.stopPropagation();
        color.locked = !color.locked;
        render();
      });
      top.appendChild(lock);

      const hexLabel = document.createElement('div');
      hexLabel.className = 'swatch__hex';
      hexLabel.textContent = hex.toUpperCase();

      const nameLabel = document.createElement('div');
      nameLabel.className = 'swatch__name';
      nameLabel.textContent = 'Clic para copiar';

      const copiedTag = document.createElement('div');
      copiedTag.className = 'swatch__copied';
      copiedTag.textContent = 'Copiado';

      swatch.append(top, hexLabel, nameLabel, copiedTag);

      swatch.addEventListener('click', () => {
        copyToClipboard(hex.toUpperCase());
        swatch.classList.add('copied');
        setTimeout(() => swatch.classList.remove('copied'), 900);
      });

      paletteEl.appendChild(swatch);
    });
  };

  const fallbackCopy = (text) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch { /* no-op */ }
    document.body.removeChild(ta);
  };

  const copyToClipboard = (text) => {
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  };

  const currentHexList = () => state.colors.map((c) => hslToHex(c.h, c.s, c.l).toUpperCase());

  // ---------------------------------------------------------------------
  // Guardadas (compartidas entre Generar y Explorar)
  // ---------------------------------------------------------------------

  const loadSaved = () => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      // normaliza el formato antiguo (array de hex) al nuevo {name, colors}
      return parsed.map((p) => (Array.isArray(p) ? { name: 'Paleta guardada', colors: p } : p));
    } catch {
      return [];
    }
  };

  const persistSaved = (list) => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    } catch { /* almacenamiento no disponible, se ignora */ }
  };

  const isSaved = (colors) => {
    const key = colors.join(',').toLowerCase();
    return loadSaved().some((p) => p.colors.join(',').toLowerCase() === key);
  };

  const toggleSavedPalette = (name, colors) => {
    const list = loadSaved();
    const key = colors.join(',').toLowerCase();
    const idx = list.findIndex((p) => p.colors.join(',').toLowerCase() === key);
    if (idx >= 0) {
      list.splice(idx, 1);
    } else {
      list.unshift({ name, colors });
      if (list.length > 24) list.length = 24;
    }
    persistSaved(list);
    renderSaved();
    renderExploreSaveStates();
  };

  const renderSaved = () => {
    const list = loadSaved();
    savedListEl.innerHTML = '';
    if (list.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'saved-empty';
      empty.textContent = 'Todavía no has guardado ninguna paleta.';
      savedListEl.appendChild(empty);
      return;
    }
    list.forEach((palette, idx) => {
      const item = document.createElement('div');
      item.className = 'saved-item';
      item.title = palette.colors.join(', ');

      const swatchesRow = document.createElement('div');
      swatchesRow.className = 'saved-item__swatches';
      palette.colors.forEach((hex) => {
        const block = document.createElement('div');
        block.className = 'saved-item__color';
        block.style.background = hex;
        swatchesRow.appendChild(block);
      });
      item.appendChild(swatchesRow);

      const footer = document.createElement('div');
      footer.className = 'saved-item__footer';
      const nameSpan = document.createElement('span');
      nameSpan.className = 'saved-item__name';
      nameSpan.textContent = palette.name || 'Paleta';
      footer.appendChild(nameSpan);

      const removeBtn = document.createElement('button');
      removeBtn.className = 'saved-item__remove';
      removeBtn.type = 'button';
      removeBtn.textContent = '×';
      removeBtn.setAttribute('aria-label', 'Eliminar paleta guardada');
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const updated = loadSaved();
        updated.splice(idx, 1);
        persistSaved(updated);
        renderSaved();
        renderExploreSaveStates();
      });
      footer.appendChild(removeBtn);
      item.appendChild(footer);

      item.addEventListener('click', () => {
        state.colors = palette.colors.map((hex) => hexToHsl(hex));
        countSelect.value = String(Math.min(Math.max(palette.colors.length, 3), 7));
        activateTab('generate');
        render();
      });

      savedListEl.appendChild(item);
    });
  };

  // ---------------------------------------------------------------------
  // Explorar: colección curada + API pública en vivo + respaldo algorítmico
  // ---------------------------------------------------------------------

  const ADJECTIVES = ['Suave', 'Profundo', 'Templado', 'Brumoso', 'Dorado', 'Sereno', 'Vivo', 'Pálido', 'Intenso', 'Nocturno', 'Luminoso', 'Tranquilo'];
  const NOUNS = ['Horizonte', 'Bruma', 'Eco', 'Deriva', 'Susurro', 'Reflejo', 'Vuelo', 'Oasis', 'Latido', 'Sendero', 'Destello', 'Marea'];

  const TAG_RANGES = {
    calidas: { hue: [-20, 55], sat: [55, 85], light: [38, 62] },
    frias: { hue: [180, 260], sat: [45, 80], light: [35, 60] },
    pastel: { hue: [0, 360], sat: [35, 55], light: [72, 88] },
    oscuras: { hue: [0, 360], sat: [30, 60], light: [14, 30] },
    vivas: { hue: [0, 360], sat: [70, 95], light: [45, 60] },
    tierra: { hue: [20, 45], sat: [25, 55], light: [30, 60] },
    todas: { hue: [0, 360], sat: [40, 80], light: [30, 70] }
  };

  const randomInRange = ([lo, hi]) => lo + Math.random() * (hi - lo);

  const randomName = () => {
    const a = ADJECTIVES[Math.floor(Math.random() * ADJECTIVES.length)];
    const n = NOUNS[Math.floor(Math.random() * NOUNS.length)];
    return `${n} ${a}`;
  };

  const generateForTag = (tag) => {
    const range = TAG_RANGES[tag] || TAG_RANGES.todas;
    let baseHue = randomInRange(range.hue);
    if (baseHue < 0) baseHue += 360;
    baseHue %= 360;
    const colors = [];
    for (let i = 0; i < 5; i++) {
      const h = (baseHue + i * (30 + Math.random() * 25)) % 360;
      const s = randomInRange(range.sat);
      const l = Math.max(10, Math.min(92, randomInRange(range.light) + (i - 2) * 4));
      colors.push(hslToHex(h, s, l).toUpperCase());
    }
    return { name: randomName(), tags: [tag === 'todas' ? 'vivas' : tag], colors, source: 'algoritmo' };
  };

  // Pide una paleta real a una API pública de color a partir de un tono
  // semilla dentro del rango de la etiqueta activa. Sin clave de API y con
  // un límite de tiempo corto para no bloquear el scroll si la red va lenta.
  const fetchPaletteFromAPI = async (tag) => {
    const range = TAG_RANGES[tag] || TAG_RANGES.todas;
    let hue = randomInRange(range.hue);
    if (hue < 0) hue += 360;
    hue %= 360;
    const seedHex = hslToHex(hue, randomInRange(range.sat), randomInRange(range.light)).slice(1);
    const mode = API_MODES[Math.floor(Math.random() * API_MODES.length)];
    const url = `${API_SCHEME_URL}?hex=${seedHex}&mode=${mode}&count=5`;

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), API_TIMEOUT_MS);
    try {
      const response = await fetch(url, { signal: controller.signal });
      if (!response.ok) throw new Error(`La API de color respondió ${response.status}`);
      const data = await response.json();
      const colors = data.colors.map((c) => c.hex.value.toUpperCase());
      const colorNames = data.colors.map((c) => c.name.value);
      const name = `${colorNames[0]} & ${colorNames[colorNames.length - 1]}`;
      return { name, tags: [tag === 'todas' ? 'vivas' : tag], colors, source: 'api' };
    } finally {
      clearTimeout(timer);
    }
  };

  const exploreState = {
    tag: 'todas',
    curatedPointer: 0,
    curatedOrder: [],
    loading: false
  };

  const shuffledCurated = () => {
    const arr = CURATED_PALETTES.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };

  // Primero agota la colección curada (instantánea); una vez vacía, pide el
  // resto a la API en paralelo y sustituye por generación algorítmica
  // cualquier petición que falle, para que el lote siempre se complete.
  const nextExploreBatch = async (count) => {
    const filterTag = exploreState.tag;
    const batch = [];

    while (batch.length < count && exploreState.curatedPointer < exploreState.curatedOrder.length) {
      const candidate = exploreState.curatedOrder[exploreState.curatedPointer];
      exploreState.curatedPointer++;
      if (filterTag === 'todas' || candidate.tags.includes(filterTag)) {
        batch.push({ ...candidate, source: 'curada' });
      }
    }

    const remaining = count - batch.length;
    if (remaining > 0) {
      const results = await Promise.allSettled(
        Array.from({ length: remaining }, () => fetchPaletteFromAPI(filterTag))
      );
      results.forEach((result) => {
        batch.push(result.status === 'fulfilled' ? result.value : generateForTag(filterTag));
      });
    }

    return batch;
  };

  const renderExploreSaveStates = () => {
    exploreGrid.querySelectorAll('.card').forEach((card) => {
      const colors = JSON.parse(card.dataset.colors);
      const btn = card.querySelector('.card__save');
      if (btn) btn.classList.toggle('is-saved', isSaved(colors));
    });
  };

  const SOURCE_LABELS = { curada: 'curada', api: 'en vivo', algoritmo: 'generada' };

  const appendExploreCard = (palette) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.colors = JSON.stringify(palette.colors);

    const swatches = document.createElement('div');
    swatches.className = 'card__swatches';
    palette.colors.forEach((hex) => {
      const block = document.createElement('div');
      block.className = 'card__color';
      block.style.background = hex;
      const tag = document.createElement('div');
      tag.className = 'card__copytag';
      tag.style.color = textColorFor(hex);
      tag.textContent = hex.toUpperCase();
      block.appendChild(tag);
      block.addEventListener('click', (e) => {
        e.stopPropagation();
        copyToClipboard(hex.toUpperCase());
      });
      swatches.appendChild(block);
    });
    card.appendChild(swatches);

    const footer = document.createElement('div');
    footer.className = 'card__footer';
    const name = document.createElement('span');
    name.className = 'card__name';
    name.textContent = palette.name;
    if (palette.source) {
      const sourceTag = document.createElement('small');
      sourceTag.className = `card__source card__source--${palette.source}`;
      sourceTag.textContent = SOURCE_LABELS[palette.source] || '';
      name.appendChild(sourceTag);
    }
    footer.appendChild(name);

    const saveBtn = document.createElement('button');
    saveBtn.className = `card__save${isSaved(palette.colors) ? ' is-saved' : ''}`;
    saveBtn.type = 'button';
    saveBtn.innerHTML = '&#9733;';
    saveBtn.setAttribute('aria-label', 'Guardar paleta');
    saveBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleSavedPalette(palette.name, palette.colors);
    });
    footer.appendChild(saveBtn);
    card.appendChild(footer);

    card.addEventListener('click', () => {
      copyToClipboard(palette.colors.join(', '));
      const original = name.firstChild?.textContent ?? name.textContent;
      name.textContent = 'Copiada ✓';
      setTimeout(() => { name.textContent = original; }, 900);
    });

    exploreGrid.appendChild(card);
  };

  const setLoadingVisible = (visible) => {
    if (loadingRow) loadingRow.style.display = visible ? 'block' : 'none';
  };

  const loadMoreExplore = async () => {
    if (exploreState.loading) return;
    exploreState.loading = true;
    setLoadingVisible(true);
    try {
      const batch = await nextExploreBatch(12);
      batch.forEach(appendExploreCard);
    } finally {
      exploreState.loading = false;
      setLoadingVisible(false);
    }
  };

  const resetExplore = (tag) => {
    exploreState.tag = tag;
    exploreState.curatedPointer = 0;
    exploreState.curatedOrder = shuffledCurated();
    exploreGrid.innerHTML = '';
    exploreScroll.scrollTop = 0;
    loadMoreExplore();
  };

  exploreScroll.addEventListener('scroll', () => {
    const distanceToBottom = exploreScroll.scrollHeight - exploreScroll.scrollTop - exploreScroll.clientHeight;
    if (distanceToBottom < 500) loadMoreExplore();
  });

  document.getElementById('filterChips').addEventListener('click', (e) => {
    const chip = e.target.closest('.filter-chip');
    if (!chip) return;
    document.querySelectorAll('.filter-chip').forEach((c) => c.classList.remove('active'));
    chip.classList.add('active');
    resetExplore(chip.dataset.tag);
  });

  // ---------------------------------------------------------------------
  // Pestañas
  // ---------------------------------------------------------------------

  const activateTab = (tab) => {
    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    document.getElementById('viewGenerate').classList.toggle('active', tab === 'generate');
    document.getElementById('viewExplore').classList.toggle('active', tab === 'explore');
  };

  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => activateTab(btn.dataset.tab));
  });

  // ---------------------------------------------------------------------
  // Wiring general
  // ---------------------------------------------------------------------

  document.getElementById('generateBtn').addEventListener('click', generate);
  document.getElementById('saveBtn').addEventListener('click', () => {
    toggleSavedPalette('Paleta generada', currentHexList());
  });
  document.getElementById('clearSavedBtn').addEventListener('click', () => {
    persistSaved([]);
    renderSaved();
    renderExploreSaveStates();
  });
  document.getElementById('exportBtn').addEventListener('click', () => {
    const css = `:root {\n${currentHexList().map((hex, i) => `  --color-${i + 1}: ${hex};`).join('\n')}\n}`;
    copyToClipboard(css);
  });
  harmonySelect.addEventListener('change', generate);
  countSelect.addEventListener('change', () => {
    state.colors = [];
    generate();
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      generate();
    }
  });

  generate();
  renderSaved();
  resetExplore('todas');
})();
</script>
</body>
</html>
